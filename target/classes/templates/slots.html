<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parking slots | SmartPark</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="main"><header><div><p class="eyebrow">OPERATIONS</p><h1>Parking slots</h1><p class="muted">Real-time availability across the facility.</p></div><a href="/book" class="btn primary">＋ New booking</a></header><div class="filters"><input id="slotSearch" placeholder="⌕  Search slot..."><select id="statusFilter"><option value="">All statuses</option><option>AVAILABLE</option><option>OCCUPIED</option><option>RESERVED</option><option>MAINTENANCE</option></select></div><section class="slot-grid"><article class="slot-card" th:each="slot:${slots}" th:attr="data-status=${slot.status},data-code=${slot.slotCode}"><div class="slot-top"><b th:text="${slot.slotCode}">A01</b><span class="badge" th:classappend="${slot.status.name().toLowerCase()}" th:text="${slot.status}">AVAILABLE</span></div><p th:text="${slot.floor}">Floor 1</p><small th:text="${slot.vehicleType+' · ₹'+slot.hourlyPrice+'/hr'}">CAR · ₹40/hr</small><a th:if="${slot.status.name() == 'AVAILABLE'}" href="/book" class="slot-action">Book this slot →</a></article></section></main><script src="/js/app.js"></script></body></html>
