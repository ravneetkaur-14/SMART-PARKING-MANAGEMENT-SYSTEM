<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entry & exit | SmartPark</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="main"><header><div><p class="eyebrow">ADMINISTRATION</p><h1>Entry & exit management</h1><p class="muted">Verify arrivals and complete active parking sessions.</p></div></header><section class="panel"><div class="table-wrap"><table><thead><tr><th>Booking</th><th>Vehicle</th><th>Slot</th><th>Schedule</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="b:${bookings}"><td class="strong" th:text="${b.bookingCode}"></td><td th:text="${b.vehicle.registrationNumber}"></td><td th:text="${b.slot.slotCode}"></td><td th:text="${b.bookingDate+' · '+b.entryTime}"></td><td><span class="badge" th:classappend="${b.status.name().toLowerCase()}" th:text="${b.status}"></span></td><td><form th:if="${b.status.name() == 'CONFIRMED'}" th:action="@{'/admin/entries/'+${b.id}+'/enter'}" method="post"><button class="btn small primary">Confirm entry</button></form><form th:if="${b.status.name() == 'ACTIVE'}" th:action="@{'/admin/entries/'+${b.id}+'/exit'}" method="post" class="inline"><select name="method"><option>UPI</option><option>CASH</option><option>CARD</option></select><button class="btn small">Complete exit</button></form><span th:if="${b.status.name() == 'COMPLETED'}" class="muted">Closed</span></td></tr></tbody></table></div></section></main></body></html>
