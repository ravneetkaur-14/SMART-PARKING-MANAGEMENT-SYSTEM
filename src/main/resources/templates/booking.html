<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a slot | SmartPark</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="main narrow"><header><div><p class="eyebrow">RESERVATION</p><h1>Book a parking slot</h1><p class="muted">Choose your vehicle, schedule and preferred slot.</p></div></header><section class="panel"><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/book" class="form-grid"><label>Vehicle<select name="vehicleId" required><option value="">Select vehicle</option><option th:each="v:${vehicles}" th:value="${v.id}" th:text="${v.registrationNumber+' · '+v.vehicleType}"></option></select></label><label>Parking slot<select name="slotId" required><option value="">Select available slot</option><option th:each="s:${slots}" th:if="${s.status.name() == 'AVAILABLE'}" th:value="${s.id}" th:text="${s.slotCode+' · '+s.floor+' · ₹'+s.hourlyPrice+'/hr'}"></option></select></label><label>Booking date<input type="date" name="bookingDate" required></label><label>Entry time<input type="time" name="entryTime" required></label><label>Expected exit<input type="time" name="exitTime" required></label><div class="form-actions"><a class="btn ghost" href="/dashboard">Cancel</a><button class="btn primary">Confirm booking →</button></div></form></section></main></body></html>
