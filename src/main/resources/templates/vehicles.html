<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehicles | SmartPark</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/layout :: nav}"></div><main class="main"><header><div><p class="eyebrow">ACCOUNT</p><h1>My vehicles</h1><p class="muted">Keep your vehicle details ready for faster booking.</p></div></header><div class="grid-2"><section class="panel"><div class="panel-head"><h2>Add vehicle</h2></div><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/vehicles"><label>Registration number<input name="registrationNumber" pattern="[A-Za-z0-9 -]{4,15}" required placeholder="PB10 AB 1234"></label><label>Vehicle type<select name="vehicleType" required><option value="BIKE">Bike</option><option value="CAR">Car</option><option value="SUV">SUV</option></select></label><label>Contact number<input name="contactNumber" placeholder="+91 98765 43210"></label><button class="btn primary">Add vehicle</button></form></section><section class="panel"><div class="panel-head"><h2>Registered vehicles</h2></div><div class="vehicle-list"><div class="vehicle" th:each="v:${vehicles}"><div class="vehicle-icon">▣</div><div><b th:text="${v.registrationNumber}">PB10AB1234</b><small th:text="${v.vehicleType+' · '+v.contactNumber}">CAR · +91</small></div><a href="/book">Book →</a></div><p class="empty" th:if="${vehicles.empty}">No vehicles registered yet.</p></div></section></div></main></body></html>
