<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartPark | Register</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth"><main class="auth-card"><div class="brand"><span>◆</span> SmartPark</div><h1>Create your account</h1><p class="muted">Join the smarter way to park.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register"><label>Full name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="btn primary wide">Create account <span>→</span></button></form><p class="center">Already have an account? <a href="/login">Sign in</a></p></main></body></html>
