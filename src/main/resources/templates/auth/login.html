<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartPark | Sign in</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth"><main class="auth-card"><div class="brand"><span>◆</span> SmartPark</div><h1>Welcome back</h1><p class="muted">Manage your parking experience effortlessly.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert success" th:if="${param.logout}">You have been signed out.</div><form method="post" action="/login"><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" required placeholder="••••••••"></label><button class="btn primary wide">Sign in <span>→</span></button></form><p class="hint">Demo admin: admin@smartpark.com / Admin@123</p><p class="center">New to SmartPark? <a href="/register">Create account</a></p></main></body></html>
